name: GnuComment

on:
  workflow_run:
    workflows: ["GnuTests"]
    types:
      - completed

permissions: {}
jobs:
  post-comment:
    permissions:
      actions: read  #  to list workflow runs artifacts
      pull-requests: write  #  to comment on pr
      issues: write  #  to update/delete existing bot comments

    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: 'Download artifact'
        uses: actions/github-script@v9
        with:
          script: |
            // List all artifacts from GnuTests
            var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });

            // Download the "comment" artifact, which contains a PR number (NR) and result.txt
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "comment"
            })[0];

            if (!matchArtifact) {
              console.log('No comment artifact found');
              return;
            }

            var download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync('${{ github.workspace }}/comment.zip', Buffer.from(download.data));
      - run: unzip comment.zip || echo "Failed to unzip comment artifact"

      - name: 'Comment on PR'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            var fs = require('fs');

            // Check if files exist
            if (!fs.existsSync('./NR')) {
              console.log('No NR file found, skipping comment');
              return;
            }
            if (!fs.existsSync('./result.txt')) {
              console.log('No result.txt file found, skipping comment');
              return;
            }

            var issue_number = Number(fs.readFileSync('./NR'));
            var content = fs.readFileSync('./result.txt', 'utf8');

            if (content.trim().length <= 7) { // 7 because we have backquote + \n
              console.log('Comment content too short, skipping');
              return;
            }

            var body = 'GNU sed testsuite comparison:\n```\n' + content + '```';

            // Avoid duplicate bot comments (e.g. one per push showing the same
            // +1 utf8-ru improvement): update the existing comparison comment
            // if present, otherwise create it. Clean up older duplicates.
            var comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              per_page: 100,
            });
            var botComments = comments.filter((c) => {
              return c.user && c.user.type === 'Bot'
                && c.body && c.body.startsWith('GNU sed testsuite comparison:');
            });

            if (botComments.length > 0) {
              var latest = botComments[botComments.length - 1];
              if (latest.body === body) {
                console.log('Existing comment is up to date, skipping update');
              } else {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: latest.id,
                  body: body,
                });
                console.log('Updated existing comment ' + latest.id);
              }
              for (var i = 0; i < botComments.length - 1; i++) {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComments[i].id,
                  });
                  console.log('Deleted duplicate comment ' + botComments[i].id);
                } catch (e) {
                  console.log('Failed to delete duplicate comment ' + botComments[i].id + ': ' + e);
                }
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: body,
              });
            }
